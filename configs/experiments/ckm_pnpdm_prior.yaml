experiment:
  name: ckm_pnpdm_prior
  description: CKM-conditioned diffusion prior with Split-Gibbs PnP-DM inference

data:
  backend: auto
  index_file: indices/{split}.json
  sampling: random_tf
  train_scenes: [scene_01, scene_02, scene_03]
  validation_scenes: [scene_01, scene_02, scene_03]
  test_scenes: [scene_01, scene_02, scene_03]
  include_observation: false
  normalization:
    mode: global_rms
    stats_file: normalization.json

# Architecture and loss are identical to ckm_diffusion_prior.yaml so its
# checkpoint can be reused without retraining.  Only the inference solver is
# changed from deterministic PnP-ADMM to stochastic Split Gibbs PnP-DM.
model:
  type: consistency
  in_channels: 2
  out_channels: 2
  dim: 32
  dim_mults: [1, 2, 4]
  groups: 8
  condition:
    enabled: true
    embed_dim: 128
    scalar_dim: 6
    state_dim: 8
    tx_beam_dim: 64
    rx_beam_dim: 16
    adp_shape: [16, 16, 12]
    dropout_prob: 0.10
    use_scalar: true
    use_state: true
    use_beam: true
    use_adp: true

consistency:
  sigma_min: 0.002
  sigma_max: 2.0
  sigma_data: 1.0
  rho: 7.0
  num_scales: 40

diffusion:
  p_mean: -1.2
  p_std: 1.2
  weighting: edm

loss:
  type: diffusion

sampling:
  solver: pnp_dm
  pnp_iterations: 100
  pnpdm_rho_start: 1.0
  pnpdm_rho_min: 0.05
  pnpdm_rho_decay: 0.9
  pnpdm_prior_steps: 100
  pnpdm_schedule_power: 7.0
  pnpdm_prior_solver: sde
  # LS is used for a controlled comparison with the existing PnP-ADMM run.
  # Set this to zero for the initialization used by Wu et al. on linear tasks.
  pnpdm_initialization: ls
  pnpdm_estimate_mode: posterior_mean
  pnpdm_burn_in: 40
  pnpdm_thin: 3

optimizer:
  name: adamw
  learning_rate: 0.0002
  weight_decay: 0.0001
  betas: [0.9, 0.99]

scheduler:
  name: cosine
  warmup_steps: 1000
  step_interval: step

training:
  seed: 3407
  validation_seed: 9102
  epochs: 200
  ema_decay: 0.999
  max_grad_norm: 1.0
  log_every_steps: 20
  validate_every_epochs: 1
  save_every_epochs: 1
