experiment:
  name: ckmsrf_full
  description: CKM-conditioned GMFlow with pilot-domain physics consistency

data:
  backend: auto
  index_file: indices/{split}.json
  sampling: random_tf
  train_scenes: [scene_01, scene_02, scene_03]
  validation_scenes: [scene_01, scene_02, scene_03]
  test_scenes: [scene_01, scene_02, scene_03]
  include_observation: true
  pilot_length: 19
  normalization:
    mode: global_rms
    stats_file: normalization.json

model:
  dim: 32
  dim_mults: [1, 2, 4]
  groups: 8
  num_components: 2
  condition:
    enabled: true
    embed_dim: 128
    scalar_dim: 6
    state_dim: 8
    tx_beam_dim: 64
    rx_beam_dim: 16
    adp_shape: [16, 16, 12]
    dropout_prob: 0.10
    use_scalar: true
    use_state: true
    use_beam: true
    use_adp: true

flow:
  time_low: 0.0
  time_high: 1.0
  transition_ratio: 0.5
  noise_std: 1.0

loss:
  gm_nll_weight: 1.0
  reconstruction_weight: 0.05
  physics_weight: 0.01

optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  betas: [0.9, 0.99]

scheduler:
  name: cosine
  warmup_steps: 500
  step_interval: step

training:
  seed: 3407
  epochs: 50
  ema_decay: 0.999
  max_grad_norm: 1.0
  log_every_steps: 20
  validate_every_epochs: 1
  save_every_epochs: 1
