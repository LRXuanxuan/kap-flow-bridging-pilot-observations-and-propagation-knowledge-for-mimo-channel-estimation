experiment:
  name: ckmcm_prior
  description: CKM-conditioned supervised consistency prior for MIMO channels

data:
  backend: auto
  index_file: indices/{split}.json
  sampling: random_tf
  train_scenes: [scene_01, scene_02, scene_03]
  validation_scenes: [scene_01, scene_02, scene_03]
  test_scenes: [scene_01, scene_02, scene_03]
  include_observation: false
  normalization:
    mode: global_rms
    stats_file: normalization.json

model:
  type: consistency
  in_channels: 2
  out_channels: 2
  dim: 32
  dim_mults: [1, 2, 4]
  groups: 8
  condition:
    enabled: true
    embed_dim: 128
    scalar_dim: 6
    state_dim: 8
    tx_beam_dim: 64
    rx_beam_dim: 16
    adp_shape: [16, 16, 12]
    dropout_prob: 0.10
    use_scalar: true
    use_state: true
    use_beam: true
    use_adp: true

consistency:
  sigma_min: 0.002
  sigma_max: 2.0
  sigma_data: 1.0
  rho: 7.0
  num_scales: 40
  endpoint_weight: 1.0
  consistency_weight: 1.0
  pseudo_huber_c: 0.03

loss:
  type: consistency
  reconstruction_weight: 0.05
  physics_weight: 0.0

sampling:
  solver: pnp_cm
  pnp_iterations: 4
  pnp_rho: 1.0
  pnp_lambda: 0.1
  pnp_adaptive_rho: false
  pnp_momentum: 0.0

optimizer:
  name: adamw
  learning_rate: 0.0002
  weight_decay: 0.0001
  betas: [0.9, 0.99]

scheduler:
  name: cosine
  warmup_steps: 1000
  step_interval: step

training:
  seed: 3407
  epochs: 200
  ema_decay: 0.999
  max_grad_norm: 1.0
  log_every_steps: 20
  validate_every_epochs: 1
  save_every_epochs: 1
