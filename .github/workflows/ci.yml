name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-and-import:
    name: static checks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package dependencies
        run: |
          pip install numpy h5py PyYAML tqdm
          pip install -e . || pip install .

      - name: Compile all Python sources
        run: python -m compileall -q src main baselines timing tests

      - name: Import packages
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import ckmsrf, journal_flow; print('import ok')"

      - name: Entry points accept --help / print usage
        run: |
          python run.py --help
          python run_paper.py || true

      - name: Collect tests (historical regression suite)
        continue-on-error: true
        run: |
          pip install pytest
          python -m pytest tests --collect-only -q
