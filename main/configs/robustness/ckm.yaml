experiment:
  name: straight_flow_robust_ckm
  description: Mask-aware CKM-conditioned straight Flow Matching prior trained with
    structured CKM mismatch
data:
  backend: plain_h5
  index_file: indices/{split}.json
  sampling: random_tf
  train_scenes:
  - scene_01
  - scene_02
  - scene_03
  validation_scenes:
  - scene_01
  - scene_02
  - scene_03
  test_scenes:
  - scene_01
  - scene_02
  - scene_03
  include_observation: false
  normalization:
    mode: global_rms
    stats_file: normalization.json
model:
  type: straight_flow_matching
  in_channels: 2
  out_channels: 2
  dim: 32
  dim_mults:
  - 1
  - 2
  - 4
  groups: 8
  condition:
    enabled: true
    use_presence_mask: true
    embed_dim: 128
    scalar_dim: 6
    state_dim: 8
    tx_beam_dim: 64
    rx_beam_dim: 16
    adp_shape:
    - 16
    - 16
    - 12
    dropout_prob: 0.1
    use_scalar: true
    use_state: true
    use_beam: true
    use_adp: true
    force_unconditional: false
straight_flow_matching:
  time_min: 0.0
  time_max: 1.0
  latent_std: 1.0
  coupling: minibatch_ot
loss:
  type: straight_flow_matching
robust_condition:
  enabled: true
  apply_in_eval: false
  scalar_noise_std: 0.05
  position_noise_std: 0.1
  velocity_noise_std: 0.1
  orientation_noise_std: 0.0
  beam_noise_std: 0.02
  beam_uniform_mix: 0.1
  beam_max_shift: 1
  adp_noise_std: 0.03
  adp_gain_std: 0.1
  adp_blur_kernel: 3
  adp_max_shift: 1
  scalar_dropout: 0.1
  state_dropout: 0.1
  beam_dropout: 0.15
  adp_dropout: 0.2
  time_frequency_dropout: 0.05
sampling:
  solver: flow_admm
  pnp_iterations: 40
  flow_initialization: ls
  flow_latent_std: 1.0
  flow_admm_tau: 0.25
  flow_admm_time_min: 0.2
  flow_admm_time_max: 0.95
  flow_admm_gamma: 0.5
  flow_admm_k_avg: 1
  flow_admm_k_avg_schedule: constant
  flow_admm_k_avg_early: 1
  flow_admm_k_avg_mid: 2
  flow_admm_k_avg_late: 5
  flow_admm_switch_frac: 0.5
  flow_admm_switch_frac_2: 0.8
optimizer:
  name: adamw
  learning_rate: 0.0002
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.99
scheduler:
  name: cosine
  warmup_steps: 1000
  step_interval: step
training:
  seed: 3407
  validation_seed: 9102
  epochs: 200
  ema_decay: 0.999
  max_grad_norm: 1.0
  log_every_steps: 20
  validate_every_epochs: 1
  save_every_epochs: 1
